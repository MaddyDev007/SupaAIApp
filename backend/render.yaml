services:
  - type: web
    name: smartclass-backend
    env: docker
    branch: main
    plan: free
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      # Required secrets: populate these in the Render Dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
